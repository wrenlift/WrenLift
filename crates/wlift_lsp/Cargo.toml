[package]
name = "wlift_lsp"
version = "0.1.14"
edition = "2021"
description = "Language Server Protocol implementation for Wren projects compiled through WrenLift. Reuses the parser + semantic analyzer; surfaces parse / sema errors as LSP diagnostics, with hover + goto-def + completion + rename arriving in later phases."

[[bin]]
name = "wlift-lsp"
path = "src/main.rs"

[dependencies]
# Compiler frontend — parser + AST + sema, plus the registry +
# hatch-bundle decode path so the LSP can pull `[dependencies]`
# from `~/.hatch/cache` and surface dep `///` docs in hover.
# `default-features` on wren_lift includes the JIT and plugin
# dlopen, neither of which the LSP needs; opt into `host`
# explicitly for the registry + hatch::load surface.
wren_lift = { path = "../..", default-features = false, features = ["host"] }

# LSP plumbing.
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
dashmap = "6"
serde_json = "1"

# Workspace hatchfile parsing — same crate the host CLI uses,
# pinned identically so the LSP and the runtime accept the same
# manifest shape.
toml = "0.8"
