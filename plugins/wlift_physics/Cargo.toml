[package]
name = "wlift_physics"
version = "0.1.4"
edition = "2021"
description = "Rapier-backed physics for the WrenLift game framework. One cdylib bundles rapier2d + rapier3d so @hatch:physics can expose World2D and World3D from a single import."
build = "build.rs"

[lib]
# `cdylib` for the host plugin loader (libloading dlopens the
# `.dylib`/`.so`/`.dll`). `rlib` for the wasm build path that
# statically links the plugin into `wlift_wasm` — wasm has no
# dynamic-library loader, so plugins ship as Rust crates the
# runtime crate links in directly.
crate-type = ["cdylib", "rlib"]

[features]
# `parallel` flips on rapier's rayon-backed island solver. Default
# on for host targets; the wasm crate opts out via
# `default-features = false` (rayon's std-thread spawn doesn't
# compile to `wasm32-unknown-unknown`).
default  = ["parallel"]
parallel = ["rapier2d/parallel", "rapier3d/parallel"]

[dependencies]
# Only the header-only `wlift_abi` crate on the plugin side. No
# `wren_lift` dep — VM/Gc/Obj* layout changes can't reach plugin
# code anymore.
wlift_abi = { path = "../../crates/wlift_abi" }
# Pinned to 0.32 — the API has changed across versions; if we
# bump these, audit the descriptor decoders below.
rapier2d = "0.32"
rapier3d = "0.32"
