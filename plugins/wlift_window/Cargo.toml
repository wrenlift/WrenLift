[package]
name = "wlift_window"
version = "0.2.10"
edition = "2021"
description = "Default window provider for the WrenLift apps — a winit-backed cdylib bundled into @hatch:window. Exposes a polled event loop and a raw-window-handle Map that @hatch:gpu's Device.createSurface accepts."
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Only the header-only `wlift_abi` crate on the plugin side. No
# `wren_lift` dep — VM/Gc/Obj* layout changes can't reach plugin
# code anymore.
wlift_abi = { path = "../../crates/wlift_abi" }

# winit 0.30: pump_events drives a polled loop that fits Wren's
# cooperative-fiber game loop. Earlier versions (≤ 0.29) require
# blocking run_event_loop / EventLoopExtRunReturn shims that
# don't compose cleanly with the polling shape we want.
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"
# Gamepad / joystick support. `gilrs` polls the OS input devices
# on every backend we ship (macOS IOKit / Linux evdev / Windows
# XInput + DirectInput) and feeds them through one cross-platform
# event API. Polled inside the same `pump_once` pass that drains
# the winit event loop so callers get one unified event stream.
gilrs = "0.10"
