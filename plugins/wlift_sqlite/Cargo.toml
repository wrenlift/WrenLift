[package]
name = "wlift_sqlite"
version = "0.1.6"
edition = "2021"
description = "SQLite plugin for the WrenLift runtime — distributed as a dylib bundled into @hatch:sqlite."
build = "build.rs"

[lib]
# `cdylib` for the host plugin loader (libloading dlopens the
# `.dylib`/`.so`/`.dll`). `rlib` for the wasm build path that
# statically links the plugin into `wlift_wasm` — wasm has no
# dynamic-library loader, so plugins ship as Rust crates the
# runtime crate links in directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the header-only `wlift_abi` crate is on the plugin side.
# No `wren_lift` dep — VM / Gc / ObjList layout changes can't reach
# plugin code anymore. The host process exports the `wlift_plugin_*`
# symbols via `#[no_mangle]`; the dynamic linker resolves the
# plugin's externs against them at dlopen. Same surface satisfies
# the wasm static-link path.
wlift_abi = { path = "../../crates/wlift_abi" }

# Native backend — `rusqlite` bundles libsqlite3 via `cc`. Doesn't
# build for `wasm32-unknown-unknown` because cc-rs can't drive
# clang's wasm32 target without a wasi sysroot, so it's gated to
# non-wasm targets only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

# Wasm backend — `sqlite-wasm-rs` ships a prebuilt sqlite-wasm
# (the official C build) wrapped as `wasm32-unknown-unknown` Rust
# bindings. The browser playground links the rlib statically into
# `wlift_wasm`; the API surface mirrors the native exports below.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = "0.5"
