[workspace]
members = [
    ".",
    "plugins/wlift_sqlite",
    "plugins/wlift_gpu",
    "plugins/wlift_window",
    "plugins/wlift_image",
    "plugins/wlift_audio",
    "plugins/wlift_physics",
    "plugins/wlift_hello",
    "plugins/wlift_noise",
    "plugins/wlift_window_web",
    "plugins/wlift_gpu_web",
    "wasm",
    "crates/wlift_lsp",
    "crates/wlift_alloc",
    "crates/wlift_region",
    "crates/wlift_abi",
]
resolver = "2"

[package]
name = "wren_lift"
version = "0.1.19"
authors = ["Damilare Akinlaja <dami@wrenlift.com>"]
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

# The binary is host-only — clap, file I/O, plugin loading. The
# wasm build skips it (cargo silently drops bins whose required
# features don't resolve on the target).
[[bin]]
name = "wlift"
path = "src/main.rs"
required-features = ["host"]

[features]
# `host` gathers every dep that doesn't compile to wasm32 (host JIT,
# plugin dlopen, sync HTTP / process / fs primitives, threaded
# tier-up broker). It's on by default so existing native builds are
# unchanged. Wasm builds pass `--no-default-features` and pick up
# only the portable parser + interpreter.
default = ["host", "cranelift"]
host = [
    "dep:dynasmrt",
    "dep:dynasm",
    "dep:libloading",
    "dep:tempfile",
    "dep:ureq",
    "dep:beadie",
    "dep:zstd",
    "dep:zip",
    "dep:sha2",
    "dep:sha1",
    "dep:md-5",
    "dep:hmac",
    "dep:aes-gcm",
    "dep:ed25519-dalek",
    "dep:argon2",
    "dep:password-hash",
    "dep:libc",
    "dep:rand",
    "dep:rand_core",
    "dep:mimalloc",
    "dep:krio-fiber",
    "dep:wlift_region",
]
# Pull in wlift_alloc as the process's `#[global_allocator]`. The
# wlift binary opts in via `required-features = ["wlift_alloc"]`;
# cdylib plugins enable `host` but NOT this feature, so they keep
# the system allocator at compile time. At runtime, plugins should
# call the `wlift_malloc` / `wlift_free` C symbols exported by the
# binary (interposed at dynamic-link time) for cross-FFI buffers,
# avoiding the dual-static-allocator hazard documented in
# `project_plugin_feature_abi.md`.
wlift_alloc = [
    "host",
    "dep:wlift_alloc",
]
# jemalloc as the process's `#[global_allocator]`. Mutually
# exclusive with `wlift_alloc` (multiple `#[global_allocator]`
# declarations don't compile); the lib.rs picks jemalloc when
# both are enabled, falling back to wlift_alloc, then system
# malloc. Build the wlift binary with `--features jemalloc` on
# Linux servers where glibc's per-arena fragmentation is the
# dominant memory pathology.
alloc_trace = []
jemalloc = [
    "host",
    "dep:tikv-jemallocator",
]
cranelift = [
    "host",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-jit",
    "dep:cranelift-native",
]
# AOT object emission. Layered on top of `cranelift` — same
# IR + same passes, but the `Module` trait impl swaps from
# `JITModule` (memory-resident codegen) to `ObjectModule`
# (writes a `.o` to disk). Off by default so the production
# JIT path stays untouched; flip on with `--features aot`
# when driving `wlift build hello.wren -o hello`.
aot = [
    "cranelift",
    "dep:cranelift-object",
    "dep:target-lexicon",
]

[dependencies]
# Pure-Rust deps that compile on every target wasm32-unknown-unknown
# included. Anything that drags in syscalls, threads, dlopen, or
# native FFI lives behind `host`.
clap = { version = "4", features = ["derive"] }
ariadne = "0.5"
logos = "0.15"
wasm-encoder = "0.245"
smallvec = "1"
# Insertion-ordered hashmap. Used for `ObjMap` so Wren's map
# iteration matches source / insertion order — same behavior
# Python 3.7+, JS Map, and Ruby Hash have. Wren's spec doesn't
# pin iteration order; this is a wlift quality-of-life
# improvement that costs ~16 bytes per entry (doubly-linked
# list bookkeeping).
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
toml = "0.8"
toml_edit = "0.22"
base64 = "0.22"

# Host-only — see the `host` feature definition above.
dynasmrt = { version = "2", optional = true }
dynasm = { version = "2", optional = true }
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
tempfile = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
regex = "1"
# `uuid` v4 and v5 are portable; v7 reads `SystemTime::now()` which
# panics on `wasm32-unknown-unknown`. We keep all three features
# enabled — calling `Uuid.v7` on wasm will surface as a runtime
# error rather than blocking the whole build. A wasm-specific shim
# that swaps the time source via `web-time` lands in Phase 1.1.
uuid = { version = "1", features = ["v4", "v5", "v7", "js"] }
aes-gcm = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "std"], optional = true }
argon2 = { version = "0.5", features = ["std", "password-hash"], optional = true }
password-hash = { version = "0.5", features = ["std", "alloc"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate", "zstd"], optional = true }
zstd = { version = "0.13", optional = true }
rand = { version = "0.9", optional = true }
rand_core = { version = "0.6", features = ["std"], optional = true }
ureq = { version = "2", features = ["tls"], optional = true }
cranelift-codegen = { version = "0.133", optional = true }
# Host-only allocator override. mimalloc replaces the system
# malloc as Rust's `#[global_allocator]` (declared in `lib.rs`),
# yielding a tighter peak-RSS profile than glibc's per-thread
# arenas — measured ~150-180mb vs glibc's 250-400mb on the same
# server workload. `default-features = false` skips the secure
# / debug builds; we just want the fast allocator. Wasm and
# anything else that doesn't enable the `host` feature continues
# to use the system allocator.
mimalloc = { version = "0.1", default-features = false, optional = true }
# jemalloc alternative — battle-tested production allocator that
# returns pages to the OS aggressively (unlike glibc's per-thread
# arena pool, which is the root cause of the 500MB-RSS plateau we
# see on Fly's debian-trixie x86_64). Gated behind the `jemalloc`
# feature so wasm / non-host builds don't try to link the C bits.
tikv-jemallocator = { version = "0.6", default-features = false, optional = true }
cranelift-frontend = { version = "0.133", optional = true }
cranelift-module = { version = "0.133", optional = true }
cranelift-jit = { version = "0.133", optional = true }
cranelift-native = { version = "0.133", optional = true }
# AOT object emission — pinned to the same 0.130 series as the
# rest of cranelift so the `Module` trait impls stay ABI-aligned.
cranelift-object = { version = "0.133", optional = true }
# `target-lexicon` is a transitive of cranelift-codegen, but the
# AOT entry point parses target triples at the top of the build
# pipeline so we depend on it directly behind the `aot` feature.
target-lexicon = { version = "0.13", optional = true }
# Tier-up / promotion broker. Pinned to 0.3 — version 0.3 brought in
# the OsrEntry / swap_compiled_with_osr APIs that `src/runtime/tier.rs`
# relies on for OSR-aware installs. Pulls in `std::thread` so it sits
# under `host` even though the crate itself is pure Rust.
beadie = { version = "0.3", optional = true }
# Stackful fiber runtime (Wren/Lua-style). Used by the AOT path on
# native targets — replaces the stackless state-machine MIR
# transform with per-fiber mmap stacks + a target-specific
# context-switch primitive. Yield-from-any-depth comes for free
# because the entire physical stack is preserved across a switch.
# Sibling project: ../krio. Unix-only stack guard pages; heap
# fallback elsewhere. WASM uses a separate Promise/Future bridge.
krio-fiber = { git = "https://github.com/darmie/krio.git", rev = "1051689b0066ac9d4d0cd1f3d78cfd3fdacd4871", optional = true }

# In-tree allocator. See the `wlift_alloc` feature above for the
# binary-only opt-in mechanism. Plugins pull this in directly
# (separate Cargo.toml dependency) so they can call the
# `wlift_malloc` / `wlift_free` C ABI for cross-FFI buffers, but
# they don't install it as a global allocator.
wlift_alloc = { path = "crates/wlift_alloc", optional = true }

# Per-fiber bump-allocator regions. Pulled in by the `host`
# feature; the runtime decides at fiber-construction time whether
# to actually create a region (gated on `WLIFT_FIBER_ARENA=1` env
# var until the design has settled). When the region is present,
# `wren_make_string` (and later `wren_make_list` / `wren_make_map`)
# tries the arena before the GC heap; the arena drops when the
# fiber transitions to a terminal state, freeing every allocation
# the fiber made without consulting the GC.
wlift_region = { path = "crates/wlift_region", optional = true }

# Wasm-specific: getrandom needs the `js` feature on wasm32-unknown-
# unknown so `rand` can pull entropy from `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `getrandom` 0.3's `wasm_js` feature pulls entropy from
# `crypto.getRandomValues` so `rand` works in browsers / Node.
getrandom = { version = "0.3", features = ["wasm_js"] }
# `std::time::Instant::now` compiles on wasm32-unknown-unknown but
# panics at runtime. `web-time` re-exports the same `Instant` /
# `SystemTime` API backed by `performance.now()` / `Date.now()`,
# so portable runtime code that needs monotonic time can swap it
# in via `use web_time as time` under `cfg(target_arch = "wasm32")`.
web-time = "1"
# Used by `runtime::foreign_wasm` to declare the JS-provided
# dynamic-plugin dispatcher. Wasm-bindgen routes `extern` blocks
# through generated JS glue, so the import shows up in the
# wasm-bindgen-built host (e.g. `wlift_wasm`) where JS can wire
# it up. Plain `extern "C"` would leave wren_lift's own wasm
# cdylib unable to link.
wasm-bindgen = "0.2"

[dev-dependencies]
capstone = "0.12"
wasmtime = "31"
wasmtime-wasi = "31"
wasmprinter = "0.226"
wasmparser = "0.226"
# AOT phase-1 test re-parses the emitted `.o` to verify the
# symbol table; pinned alongside cranelift-object's transitive
# version so the parser handles whatever container shape the
# emitter produced (ELF / Mach-O / PE).
object = { version = "0.36", default-features = false, features = ["read"] }

# `cargo install` honours these. `strip = "none"` is explicit
# because the linker-generated adhoc codesignature on macOS only
# matches the unstripped binary — stripping invalidates the cs
# and the kernel SIGKILLs on spawn (no dialog, just exit 137).
# Linux / Windows builds don't care about codesignature, but the
# binary stays larger; that's an acceptable tradeoff for a build-
# from-source path.
[profile.release]
strip = "none"

# Pin Cranelift to upstream wasmtime `main` so the build picks up:
#
#   * `decb45f` ("cranelift: include every SSA value bound to a
#     variable in stack maps") — fixes earlier-def drops in
#     re-defined Variables, closes a class of AOT stack-map gaps;
#   * the `cranelift-object: emit PLATFORM_MACOS for Darwin
#     triples on macOS hosts` patch — fixes ld64 rejecting
#     PLATFORM_UNKNOWN object files when emitting on macOS.
#
# Both have been merged upstream; the git pin holds until the next
# crates.io release ships them. Upstream main is Cranelift 0.133
# vs the 0.130 we'd otherwise resolve to, so AOT codegen also
# absorbs the API drift (`MemFlags` → `MemFlagsData` rename).
# Remove this block to fall back to crates.io once the release lands.
[patch.crates-io]
cranelift-codegen = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "main" }
cranelift-frontend = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "main" }
cranelift-module = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "main" }
cranelift-jit = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "main" }
cranelift-native = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "main" }
cranelift-object = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "main" }
