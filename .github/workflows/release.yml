name: Release binaries

# Triggered on `v*` tag push (e.g. `v0.1.0`, `v0.2.0-rc1`). Builds
# `wlift` + `hatch` + `wlift-lsp` for every supported target, bundles
# each set into a tarball (a zip on Windows) with a SHA256 checksum,
# and attaches everything to a GitHub Release.
#
# `wlift` links LLVM 21 statically for its top tier, so every leg
# builds on a runner of its own architecture with the toolchain from
# the llvm21 action; `hatch` and `wlift-lsp` build without it.
#
# Consumers grab binaries via `install.sh` (curl | bash style) —
# the script parses this release's asset list, so the artifact
# naming below is load-bearing: changing it breaks the installer.
#
# Manual dispatch is supported too, for re-cutting a release
# without a fresh tag (or running against a preview rev).

on:
  push:
    tags:
      # Runtime tags only — `v0.1.x`. Without the digit anchor
      # the glob matches `vscode-v*` (extension releases) and
      # any other workstream that prefixes with `v`, which
      # produced spurious runtime-shaped GitHub releases that
      # confused `install.sh`'s `releases/latest` resolver.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to produce (e.g. v0.1.0). Must already exist."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------
  # Resolve: pull the tag once and emit it so downstream jobs can
  # reference it without reparsing `github.ref_name`.
  # ---------------------------------------------------------------
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag:  ${{ steps.out.outputs.tag }}
    steps:
      - name: Pick tag
        id: out
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::tag must start with 'v' (got '$tag')" && exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The build jobs check out the tag's tree, and the composite
      # actions and scripts they run come from it, not from this
      # file: a tag that predates the release tooling fails in
      # minutes with an unrelated error. Fail here instead.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.out.outputs.tag }}
          sparse-checkout: |
            tools/package_release.sh
            .github/actions/llvm21/action.yml
          sparse-checkout-cone-mode: false
      - name: Check the tag carries the release tooling
        shell: bash
        run: |
          set -eu
          if [ ! -x tools/package_release.sh ] \
             || ! grep -q "Install LLVM 21 (macOS)" .github/actions/llvm21/action.yml; then
            echo "::error::tag ${{ steps.out.outputs.tag }} predates the release tooling; tag a commit at or after the one that added tools/package_release.sh" && exit 1
          fi

  # ---------------------------------------------------------------
  # Build: one matrix entry per supported target. Each job emits a
  # `wlift-<tag>-<triple>.tar.gz` with both binaries and a matching
  # `.sha256` next to it.
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every leg builds on its own architecture: the static
          # LLVM the top tier links comes from the runner's package
          # manager, and there is no cross-compiled copy of it.
          - label:    macos-arm64
            os:       macos-14
            target:   aarch64-apple-darwin
          - label:    macos-x86_64
            os:       macos-15-intel
            target:   x86_64-apple-darwin
          - label:    linux-x86_64
            os:       ubuntu-24.04
            target:   x86_64-unknown-linux-gnu
          - label:    linux-arm64
            os:       ubuntu-24.04-arm
            target:   aarch64-unknown-linux-gnu
    # A retired or saturated runner image must fail this leg, not
    # stall the release behind it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: ./.github/actions/llvm21

      - name: Build wlift
        run: cargo build --release --features llvm --bin wlift --target ${{ matrix.target }}

      # Without the llvm feature: the package tool and the language
      # server run no top tier, and the feature would put LLVM in
      # each of them too.
      - name: Build hatch
        run: cargo build --release --bin hatch --target ${{ matrix.target }}

      # `-p wlift_lsp` needs its own invocation: cargo's `--bin`
      # only sees bins from the package selected by `-p`, so we
      # can't combine the wren_lift bins with the wlift_lsp bin
      # in a single command.
      - name: Build wlift-lsp
        run: cargo build --release -p wlift_lsp --target ${{ matrix.target }}

      - name: Smoke test the binaries
        run: |
          bin="target/${{ matrix.target }}/release"
          "$bin/wlift" --version
          "$bin/hatch" --version
          "$bin/wlift-lsp" --version
          "$bin/wlift" --mode tiered bench/fib.wren
          WLIFT_TIER_TRACE=1 "$bin/wlift" bench/ash/method_call.wren 2>&1 | grep -q "llvm " \
            || { echo "::error::the top tier did not compile with LLVM"; exit 1; }

      - name: Package tarball + checksum
        run: |
          tools/package_release.sh "${{ needs.resolve.outputs.tag }}" \
            "${{ matrix.target }}" "target/${{ matrix.target }}/release"

      # The packaged binary, from a directory with nothing else in it.
      - name: Smoke test the packaged binary
        run: |
          stage="wlift-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}"
          tar xzf "dist/${stage}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${stage}/wlift" bench/ash/nbody.wren

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/wlift-*.tar.gz
            dist/wlift-*.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Windows: its own job rather than a matrix leg, as the packaging
  # is a zip made in PowerShell and the binaries are checked by
  # running them before they ship. Emits
  # `wlift-<tag>-x86_64-pc-windows-msvc.zip` and its `.sha256`.
  # ---------------------------------------------------------------
  windows:
    name: Build windows-x86_64
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - uses: ./.github/actions/llvm21

      - name: Build wlift
        run: cargo build --release --features llvm --bin wlift --target x86_64-pc-windows-msvc

      - name: Build hatch
        run: cargo build --release --bin hatch --target x86_64-pc-windows-msvc

      - name: Build wlift-lsp
        run: cargo build --release -p wlift_lsp --target x86_64-pc-windows-msvc

      - uses: ./.github/actions/llvm21-runtime-dlls
        with:
          into: target\x86_64-pc-windows-msvc\release\

      # A binary that starts is what ships: run each one, and a
      # program through the tiers.
      - name: Smoke test the binaries
        shell: pwsh
        run: |
          $bin = "target\x86_64-pc-windows-msvc\release"
          & "$bin\wlift.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "wlift --version failed" }
          & "$bin\hatch.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "hatch --version failed" }
          & "$bin\wlift-lsp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "wlift-lsp --version failed" }
          & "$bin\wlift.exe" --mode tiered bench\fib.wren
          if ($LASTEXITCODE -ne 0) { throw "wlift bench/fib.wren failed" }
          $env:WLIFT_TIER_TRACE = "1"
          $trace = & "$bin\wlift.exe" bench\ash\method_call.wren 2>&1 | Out-String
          Remove-Item Env:WLIFT_TIER_TRACE
          if ($trace -notmatch "llvm ") { throw "the top tier did not compile with LLVM" }

      - name: Package zip + checksum
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve.outputs.tag }}"
          $triple = "x86_64-pc-windows-msvc"
          $stage = "wlift-$tag-$triple"
          $bin = "target\$triple\release"
          New-Item -ItemType Directory -Force "dist\$stage" | Out-Null
          Copy-Item "$bin\wlift.exe", "$bin\hatch.exe", "$bin\wlift-lsp.exe" "dist\$stage\"
          # The DLLs LLVM imports; wlift.exe does not start without them.
          Copy-Item "$bin\*.dll" "dist\$stage\"
          @"
          wlift $tag     - Wren runtime (JIT + interpreter)
          hatch $tag     - Package + build tool for Wren
          wlift-lsp $tag - Language server (LSP) for editors

          Add this dir to your PATH to use the binaries directly.
          The binaries need the Microsoft Visual C++ Redistributable (2015+).
          Docs: https://github.com/wrenlift/WrenLift
          "@ | Out-File -Encoding ascii "dist\$stage\README.txt"
          Compress-Archive -Path "dist\$stage" -DestinationPath "dist\$stage.zip"
          $hash = (Get-FileHash "dist\$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist\$stage.zip.sha256"
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/wlift-*.zip
            dist/wlift-*.zip.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Publish: collect every matrix artifact, attach to a release.
  # Uses `softprops/action-gh-release` so re-running the workflow
  # (via workflow_dispatch) updates the existing release in place
  # rather than failing.
  # ---------------------------------------------------------------
  publish:
    name: Publish release
    needs: [resolve, build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: Flatten assets
        shell: bash
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -la release/

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          files: release/*
          # Keep prior release body if the release already exists —
          # avoids nuking hand-written notes on re-runs.
          generate_release_notes: true
          fail_on_unmatched_files: true
