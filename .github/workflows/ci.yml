name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      # A crash under the parallel test harness takes every in-flight
      # test with it and names none; one at a time, the log says which.
      - name: Serial tests with backtraces (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUST_TEST_THREADS=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RUST_BACKTRACE=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --all-targets

      # Page heap makes a heap-corrupting write fault at the write, so
      # the fault handler names it; without it Windows reports only
      # STATUS_HEAP_CORRUPTION at some later free.
      - name: Page heap for the unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = cargo test --release --lib --no-run 2>&1 | Out-String
          $m = [regex]::Match($out, '([A-Za-z0-9_-]+\.exe)\)')
          if (-not $m.Success) { throw "no test executable in cargo's output" }
          $name = $m.Groups[1].Value
          Write-Host "page heap on $name"
          $key = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$name"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name GlobalFlag -PropertyType DWord -Value 0x02000000 -Force | Out-Null
          New-ItemProperty -Path $key -Name PageHeapFlags -PropertyType DWord -Value 3 -Force | Out-Null

      - name: Unit tests
        run: cargo test --release --lib

      - name: E2E tests
        run: cargo test --release --test e2e

      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      # Same lint bar for the wasm runtime build. The library has
      # large chunks gated to `feature = "host"` (JIT, plugin
      # loader, hatch packaging) — a crate-level `allow(dead_code,
      # unused_imports, unused_variables, unreachable_patterns)`
      # under `cfg(not(feature = "host"))` keeps the gated paths
      # from drowning real warnings in the rest.
      #
      # Linux-only: `wlift_sqlite`'s wasm path pulls
      # `sqlite-wasm-rs`, whose build script invokes
      # `clang --target=wasm32-unknown-unknown` against the host
      # clang. macOS runners ship Apple's `/usr/bin/clang`, which
      # lacks the wasm32 LLVM backend, so the build script aborts
      # before clippy ever runs. The wasm output is
      # host-independent — Linux coverage is sufficient.
      - name: Clippy (wasm32-unknown-unknown)
        if: runner.os == 'Linux'
        run: |
          cargo clippy --lib --target wasm32-unknown-unknown \
            --no-default-features -- -D warnings
          cargo clippy -p wlift_wasm --target wasm32-unknown-unknown \
            -- -D warnings

      - name: Install WASI SDK (for sqlite-wasm-rs's cc compile)
        # The wasm smoke test compiles `wlift_wasm` for
        # `wasm32-wasip1`, which pulls in `wlift_sqlite`'s
        # wasm backend (`sqlite-wasm-rs`). That crate's
        # build script invokes clang against bundled C
        # source and needs a WASI sysroot for the wasi-libc
        # headers — without `WASI_SYSROOT` set, clang reaches
        # for `/usr/include/stdint.h` and aborts on
        # `bits/libc-header-start.h not found`. Drop the SDK
        # under `/opt` and export the env vars cc-rs reads.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          WASI_SDK_VERSION="25"
          WASI_SDK_FULL="25.0"
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_FULL}-x86_64-linux.tar.gz" \
            | sudo tar -xzC /opt
          {
            echo "WASI_SDK_PATH=/opt/wasi-sdk-${WASI_SDK_FULL}-x86_64-linux"
            echo "WASI_SYSROOT=/opt/wasi-sdk-${WASI_SDK_FULL}-x86_64-linux/share/wasi-sysroot"
            echo "CC_wasm32_wasip1=/opt/wasi-sdk-${WASI_SDK_FULL}-x86_64-linux/bin/clang"
          } >> "$GITHUB_ENV"

      - name: Wasm smoke test (baseline + simd128)
        # The smoke test internally builds the wasi smoke binary
        # twice — once with the default flags (the baseline build
        # that runs on every browser) and once with
        # `RUSTFLAGS=-C target-feature=+simd128` (the SIMD build
        # for modern browsers). Both are run under the embedded
        # `wasmtime` runtime; the simd128 leg additionally walks
        # the wasm code section and asserts v128 opcodes are
        # actually present, so a regression that quietly drops
        # `simd_kernels.rs`'s explicit `core::arch::wasm32` paths
        # back to the scalar fallback can't sneak through. Same
        # macOS-clang constraint as the wasm clippy step above.
        if: runner.os == 'Linux'
        run: cargo test --release --test wasm_smoke -- --nocapture

      - name: Format check
        run: cargo fmt -- --check

  # The LLVM top tier is off the default feature set; this job builds
  # it against the same LLVM 21 the code is pinned to and runs the
  # suites that exercise promotion. The toolchain comes from the
  # llvm21 action on both runners; Windows needs the DLLs beside the
  # binary before anything runs it.
  llvm-tier:
    name: LLVM tier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: llvm-${{ matrix.os }}

      - name: Serial tests with backtraces (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUST_TEST_THREADS=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RUST_BACKTRACE=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: ./.github/actions/llvm21

      # The test binaries under target/release/deps link the shared
      # LLVM too; Windows finds it through PATH.
      - name: LLVM DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$PWD\llvmenv\Library\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        run: cargo build --release --features llvm --bin wlift

      - uses: ./.github/actions/llvm21-runtime-dlls
        if: runner.os == 'Windows'
        with:
          into: target\release\

      # Page heap makes a heap-corrupting write fault at the write, so
      # the fault handler names it; without it Windows reports only
      # STATUS_HEAP_CORRUPTION at some later free.
      - name: Page heap for the unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = cargo test --release --features llvm --lib --no-run 2>&1 | Out-String
          $m = [regex]::Match($out, '([A-Za-z0-9_-]+\.exe)\)')
          if (-not $m.Success) { throw "no test executable in cargo's output" }
          $name = $m.Groups[1].Value
          Write-Host "page heap on $name"
          $key = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$name"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name GlobalFlag -PropertyType DWord -Value 0x02000000 -Force | Out-Null
          New-ItemProperty -Path $key -Name PageHeapFlags -PropertyType DWord -Value 3 -Force | Out-Null

      - name: Unit tests
        run: cargo test --release --features llvm --lib

      - name: E2E tests
        run: cargo test --release --features llvm --test e2e

      - name: Clippy
        run: cargo clippy --release --features llvm -- -D warnings

      - name: Benchmarks on the LLVM tier
        if: runner.os != 'Windows'
        run: |
          for b in fib method_call nbody binary_trees delta_blue; do
            printf '%s: ' "$b"
            ./target/release/wlift --mode tiered bench/$b.wren | grep elapsed
          done

      - name: Benchmarks on the LLVM tier (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($b in "fib", "method_call", "nbody", "binary_trees", "delta_blue") {
            Write-Host -NoNewline "${b}: "
            & .\target\release\wlift.exe --mode tiered "bench\$b.wren" | Select-String elapsed
            if ($LASTEXITCODE -ne 0) { throw "$b failed with exit code $LASTEXITCODE" }
          }
